<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Simple Static Example</title>
  <script src="./bootloader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; }
    body { background: #000; }
    canvas { display: block; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // Synchronous bootloader - works immediately!
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Use viewport dimensions (set by extractor from manifest)
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Draw with deterministic randomness
    const random = $bootloader.rnd;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 50; i++) {
      const x = random() * canvas.width;
      const y = random() * canvas.height;
      const r = random() * 50 + 10;
      const hue = random() * 360;

      ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Set features for metadata
    $bootloader.setFeatures({
      'Circles': 50,
      'Style': 'Colorful'
    });

    // Capture when in capture mode
    if ($bootloader.isCapture) {
      $bootloader.capture();
    }
  </script>
</body>
</html>
